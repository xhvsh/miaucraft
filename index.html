<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="view-transition" content="same-origin" />
    <title>Map - Miaucraft</title>
    <meta name="description" content="Explore the Miaucraft SMP from anywhere - overworld, nether and end waypoints on a live map." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/img/icon.webp" type="image/webp" />
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" as="script" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/384138011e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/map.css" />
  </head>
  <body data-page="map">
    <a class="skip-link" href="#mainContent">Skip to content</a>
    <div class="app-shell">
      <div id="navRoot"></div>

      <main class="page-main map-main" id="mainContent" tabindex="-1">
        <div class="map-toolbar">
          <div class="dim-tabs" id="dimTabs" role="tablist" aria-label="Dimension">
            <button class="dim-tab" data-dim="overworld" data-active="true" role="tab" aria-selected="true" aria-controls="gridPanel">Overworld</button>
            <button class="dim-tab" data-dim="nether" role="tab" aria-selected="false" aria-controls="gridPanel">Nether</button>
            <button class="dim-tab" data-dim="end" role="tab" aria-selected="false" aria-controls="gridPanel">End</button>
          </div>
          <div class="toolbar-actions">
            <button class="icon-btn" id="biomeToggleBtn" type="button" title="Toggle biome map" aria-label="Toggle biome map" aria-pressed="true">
              <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
            </button>
            <button class="icon-btn add-waypoint-btn" id="addWaypointBtn" type="button" title="Add waypoint" aria-label="Add waypoint" hidden>
              <i class="fa-solid fa-plus" aria-hidden="true"></i>
            </button>
            <button class="icon-btn sidebar-toggle-btn" id="sidebarToggleBtn" type="button" title="Toggle waypoint list" aria-label="Toggle waypoint list" aria-expanded="false">
              <i class="fa-solid fa-list" aria-hidden="true"></i>
              <span class="waypoint-count-pill" id="waypointCountPill">0</span>
            </button>
          </div>
        </div>

        <div class="map-workspace">
          <section class="grid-panel" id="gridPanel">
            <div class="grid-container" id="gridContainer"></div>

            <div class="grid-controls">
              <button class="icon-btn" id="zoomInBtn" type="button" title="Zoom in" aria-label="Zoom in"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
              <button class="icon-btn" id="zoomOutBtn" type="button" title="Zoom out" aria-label="Zoom out"><i class="fa-solid fa-minus" aria-hidden="true"></i></button>
              <button class="icon-btn icon-btn--wide" id="recenterBtn" type="button" title="Back to origin" aria-label="Back to origin"><i class="fa-solid fa-crosshairs" aria-hidden="true"></i></button>
            </div>

            <div class="biome-legend" id="biomeLegend" hidden></div>
          </section>

          <div class="pin-tooltip" id="pinTooltip" hidden></div>

          <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

          <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
              <h2 id="sidebarTitle">Overworld</h2>
              <span class="waypoint-count" id="waypointCount">0</span>
              <button class="modal-close sidebar-close-btn" id="sidebarCloseBtn" type="button" aria-label="Close waypoint list">&times;</button>
            </div>
            <div class="search-field waypoint-search-wrap">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input type="search" id="waypointSearch" placeholder="Search waypoints" aria-label="Search waypoints" />
            </div>
            <div class="sidebar-filter-wrap">
              <div class="category-filter-row" id="categoryFilterRow"></div>
              <div class="category-filter-row" id="userFilterRow" hidden></div>
            </div>
            <div class="skeleton-list waypoint-skeleton" id="waypointSkeleton" hidden>
              <div class="skeleton sk-row">
                <span class="skeleton sk-icon"></span>
                <div class="sk-lines">
                  <div class="skeleton sk-line" style="width:52%"></div>
                  <div class="skeleton sk-line tiny" style="width:38%"></div>
                </div>
              </div>
              <div class="skeleton sk-row">
                <span class="skeleton sk-icon"></span>
                <div class="sk-lines">
                  <div class="skeleton sk-line" style="width:60%"></div>
                  <div class="skeleton sk-line tiny" style="width:34%"></div>
                </div>
              </div>
              <div class="skeleton sk-row">
                <span class="skeleton sk-icon"></span>
                <div class="sk-lines">
                  <div class="skeleton sk-line" style="width:44%"></div>
                  <div class="skeleton sk-line tiny" style="width:30%"></div>
                </div>
              </div>
            </div>
            <div class="waypoint-list" id="waypointList"></div>
            <div class="empty-state" id="waypointListEmpty" hidden>
              <i class="fa-solid fa-map-pin" aria-hidden="true"></i>
              <span>No waypoints here yet.</span>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <!-- Waypoint add/edit modal -->
    <div class="modal-backdrop" id="waypointModal" hidden>
      <div class="modal waypoint-modal-card">
        <button class="modal-close" id="waypointModalClose" type="button" aria-label="Close">&times;</button>
        <h3 class="modal-title" id="waypointModalTitle">Add waypoint</h3>

        <form class="modal-form" id="waypointForm">
          <input type="hidden" id="wpId" />
          <label>
            Name
            <input type="text" id="wpName" required maxlength="60" />
          </label>
          <label>
            Description
            <input type="text" id="wpDescription" maxlength="160" />
          </label>
          <div class="coord-row">
            <label><span>X</span><input type="number" id="wpX" class="no-spinner" step="1" /></label>
            <label><span>Y <span class="optional">(optional)</span></span><input type="number" id="wpY" class="no-spinner" step="1" /></label>
            <label><span>Z</span><input type="number" id="wpZ" class="no-spinner" step="1" /></label>
          </div>
          <div class="nether-preview" id="netherPreview" hidden></div>
          <label class="category-picker-field">
            Category
            <div class="category-picker" id="categoryPicker">
              <input type="hidden" id="wpCategory" value="" />
              <button type="button" class="category-picker-trigger" id="categoryPickerTrigger" aria-haspopup="listbox" aria-expanded="false">
                <span class="category-picker-content" id="categoryPickerTriggerContent">
                  <span class="category-picker-icon category-picker-icon--none"><i class="fa-solid fa-ban" aria-hidden="true"></i></span>
                  <span class="category-picker-label">No category</span>
                </span>
                <i class="fa-solid fa-chevron-down category-picker-chevron" aria-hidden="true"></i>
              </button>
              <div class="category-picker-menu" id="categoryPickerMenu" role="listbox" hidden></div>
            </div>
          </label>
          <label class="visibility-picker-field">
            Visibility
            <input type="hidden" id="wpVisibility" value="public" />
            <div class="visibility-picker" id="visibilityPicker">
              <button type="button" class="visibility-picker-option" data-visibility="public" data-active="true"><i class="fa-solid fa-globe" aria-hidden="true"></i>Public</button>
              <button type="button" class="visibility-picker-option" data-visibility="private"><i class="fa-solid fa-lock" aria-hidden="true"></i>Private</button>
            </div>
          </label>
          <label>
            Color
            <span class="color-picker">
              <input type="color" id="wpColor" value="#9683e0" aria-label="Waypoint color" />
              <span class="color-value" id="wpColorValue">#9683E0</span>
            </span>
          </label>
          <div class="modal-actions">
            <button class="btn btn-primary" type="submit">Save</button>
            <button class="btn btn-danger" id="wpDeleteBtn" type="button" hidden aria-label="Delete waypoint" title="Delete waypoint">
              <i class="fa-solid fa-trash" aria-hidden="true"></i>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Gallery viewer: browse all screenshots of a waypoint (arrows on desktop, swipe on touch) -->
    <div class="modal-backdrop image-lightbox-backdrop" id="imageLightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
      <button class="modal-close gallery-viewer-close" id="galleryViewerClose" type="button" aria-label="Close viewer">&times;</button>
      <button class="icon-btn gallery-viewer-arrow gallery-viewer-arrow--prev" id="galleryViewerPrev" type="button" aria-label="Previous image">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
      </button>
      <div class="gallery-viewer-viewport">
        <div class="gallery-viewer-track" id="galleryViewerTrack"></div>
        <div class="gallery-viewer-bar" id="galleryViewerBar" hidden>
          <div class="gallery-viewer-bar-text">
            <span class="gallery-viewer-caption" id="galleryViewerCaption" hidden></span>
            <span class="gallery-viewer-credit" id="galleryViewerCredit" hidden></span>
          </div>
          <span class="gallery-viewer-counter" id="galleryViewerCounter" hidden></span>
        </div>
      </div>
      <button class="icon-btn gallery-viewer-arrow gallery-viewer-arrow--next" id="galleryViewerNext" type="button" aria-label="Next image">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
      </button>
      <div class="gallery-viewer-thumbs" id="galleryViewerThumbs" hidden></div>
    </div>

    <input type="file" id="wpGalleryFileInput" accept="image/jpeg,image/png,image/webp" multiple hidden />

    <!-- Waypoint detail view: full info + gallery + collaborators -->
    <div class="modal-backdrop waypoint-detail-backdrop" id="waypointDetailModal" hidden>
      <div class="modal waypoint-detail-card">
        <button class="modal-close" id="waypointDetailClose" type="button" aria-label="Close">&times;</button>

        <div class="waypoint-detail-head">
          <span class="waypoint-card-dot waypoint-detail-dot" id="waypointDetailDot"></span>
          <h3 class="waypoint-detail-name" id="waypointDetailName"></h3>
        </div>

        <img class="waypoint-detail-image" id="waypointDetailImage" alt="" hidden />

        <p class="waypoint-detail-desc" id="waypointDetailDesc" hidden></p>
        <div class="waypoint-detail-meta" id="waypointDetailMeta"></div>
        <div class="waypoint-detail-coords" id="waypointDetailCoords"></div>
        <div class="waypoint-detail-conversion" id="waypointDetailConversion" hidden></div>

        <div class="waypoint-detail-actions" id="waypointDetailActions"></div>

        <section class="waypoint-detail-section">
          <div class="waypoint-detail-section-head">
            <span class="waypoint-detail-section-title">Gallery <span class="waypoint-detail-count" id="waypointGalleryCount">0</span></span>
            <button type="button" class="btn btn-ghost btn-sm" id="waypointGalleryAddBtn" hidden><i class="fa-solid fa-plus" aria-hidden="true"></i>Add screenshot</button>
          </div>
          <div class="waypoint-gallery" id="waypointGallery"></div>
          <div class="waypoint-detail-empty" id="waypointGalleryEmpty" hidden>
            <span>No screenshots yet.</span>
          </div>
        </section>

        <section class="waypoint-detail-section">
          <div class="waypoint-detail-section-head">
            <span class="waypoint-detail-section-title">Users <span class="waypoint-detail-count" id="waypointCollabCount">1</span></span>
            <button type="button" class="btn btn-ghost btn-sm" id="waypointCollabAddBtn" hidden><i class="fa-solid fa-user-plus" aria-hidden="true"></i>Invite</button>
          </div>
          <div class="waypoint-collaborators" id="waypointCollaborators"></div>
          <div class="waypoint-detail-empty" id="waypointCollabEmpty" hidden>
            <span>No other users yet.</span>
          </div>

          <div class="waypoint-person-search" id="waypointCollabSearchWrap" hidden>
            <div class="search-field">
              <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
              <input type="search" id="waypointPersonSearch" placeholder="Search username" aria-label="Search username" autocomplete="off" />
            </div>
            <div class="waypoint-person-results" id="waypointPersonResults"></div>
          </div>
        </section>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script type="module" src="/js/pages/map.js"></script>
  </body>
</html>
