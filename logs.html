<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="view-transition" content="same-origin" />
    <title>Logs - Miaucraft</title>
    <meta name="description" content="Activity log for waypoints, categories and the whitelist on the Miaucraft SMP." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="img/icon.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/384138011e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <link rel="stylesheet" href="css/logs.css" />
  </head>
  <body data-page="logs">
    <a class="skip-link" href="#mainContent">Skip to content</a>
    <div class="app-shell">
      <div id="navRoot"></div>

      <main class="page-main page-main--logs" id="mainContent" tabindex="-1">
        <div class="page-container logs-container">
          <div class="page-head">
            <div>
              <h1>Logs</h1>
              <p>Activity across waypoints, categories and the whitelist.</p>
            </div>
          </div>

          <div class="empty-state" id="logsSignedOut" hidden>
            <i class="fa-solid fa-lock" aria-hidden="true"></i>
            <span>Sign in to view activity logs.</span>
          </div>

          <section class="card logs-card" id="logsBody" hidden>
            <div class="logs-toolbar">
              <div class="search-field">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input type="search" id="logSearch" placeholder="Search activity" aria-label="Search activity" />
              </div>
              <button class="btn btn-ghost" id="logsFiltersToggle" type="button" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-filter" aria-hidden="true"></i> Filters <span class="filters-dot" id="logsFiltersDot" hidden></span></button>

              <div class="logs-filters-menu" id="logsFiltersMenu" hidden>
                <div class="logs-filter-group">
                  <span class="logs-filter-label">Type</span>
                  <div id="logEntityFilterRoot"></div>
                </div>
                <div class="logs-filter-group">
                  <span class="logs-filter-label">User</span>
                  <div id="logUserFilterRoot"></div>
                </div>
                <div class="logs-filter-group">
                  <span class="logs-filter-label">Action</span>
                  <div id="logActionFilterRoot"></div>
                </div>
                <div class="logs-filter-group" id="logDimensionFilterWrap">
                  <span class="logs-filter-label">Dimension</span>
                  <div id="logDimensionFilterRoot"></div>
                </div>
                <button class="btn btn-ghost logs-filters-reset" id="logsFiltersReset" type="button" hidden><i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Reset filters</button>
              </div>
            </div>

            <div class="logs-list">
              <div class="skeleton-list" id="logsLoading">
                <div class="skeleton sk-row">
                  <span class="skeleton sk-icon"></span>
                  <div class="sk-lines">
                    <div class="skeleton sk-line" style="width:72%"></div>
                    <div class="skeleton sk-line tiny" style="width:32%"></div>
                  </div>
                </div>
                <div class="skeleton sk-row">
                  <span class="skeleton sk-icon"></span>
                  <div class="sk-lines">
                    <div class="skeleton sk-line" style="width:66%"></div>
                    <div class="skeleton sk-line tiny" style="width:36%"></div>
                  </div>
                </div>
                <div class="skeleton sk-row">
                  <span class="skeleton sk-icon"></span>
                  <div class="sk-lines">
                    <div class="skeleton sk-line" style="width:76%"></div>
                    <div class="skeleton sk-line tiny" style="width:28%"></div>
                  </div>
                </div>
              </div>
              <div id="logsList"></div>
              <div class="empty-state" id="logsEmpty" hidden><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i><span>No activity yet.</span></div>
            </div>

            <div class="logs-pagination" id="logsPagination" hidden>
              <button class="icon-btn" id="logsFirstPageBtn" type="button" aria-label="First page"><i class="fa-solid fa-angles-left" aria-hidden="true"></i></button>
              <button class="icon-btn" id="logsPrevPageBtn" type="button" aria-label="Previous page"><i class="fa-solid fa-angle-left" aria-hidden="true"></i></button>
              <span class="logs-page-info">Page <input type="number" id="logsPageInput" min="1" class="no-spinner" /> of <span id="logsPageTotal">1</span></span>
              <button class="icon-btn" id="logsNextPageBtn" type="button" aria-label="Next page"><i class="fa-solid fa-angle-right" aria-hidden="true"></i></button>
              <button class="icon-btn" id="logsLastPageBtn" type="button" aria-label="Last page"><i class="fa-solid fa-angles-right" aria-hidden="true"></i></button>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script type="module" src="js/pages/logs.js"></script>
  </body>
</html>
