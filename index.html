<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miaucraft — waypoints</title>
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script src="https://kit.fontawesome.com/384138011e.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">MIAUCRAFT</div>

      <nav class="dim-tabs" id="dimTabs">
        <button class="dim-tab" data-dim="overworld" data-active="true">Overworld</button>
        <button class="dim-tab" data-dim="nether">Nether</button>
        <button class="dim-tab" data-dim="end">End</button>
        <button class="dim-tab dim-tab--server" data-dim="server" hidden>Server</button>
      </nav>

      <button class="btn btn-ghost categories-btn" id="categoriesBtn" type="button" hidden aria-haspopup="true" aria-expanded="false">
        <i class="fa-solid fa-tags" aria-hidden="true"></i>
        <span class="categories-btn-label">Categories</span>
      </button>

      <button class="icon-btn sidebar-toggle-btn" id="sidebarToggleBtn" type="button" title="Toggle waypoint list" aria-label="Toggle waypoint list" aria-expanded="false">
        <i class="fa-solid fa-list" aria-hidden="true"></i>
      </button>

      <div class="auth-area" id="authArea">
        <span class="auth-status">guest</span>
        <button class="btn btn-ghost" id="signInBtn" type="button">Sign in</button>
      </div>
    </header>

    <main class="workspace">
      <section class="grid-panel" id="gridPanel">
        <div class="grid-container" id="gridContainer"></div>
        <p class="map-hint">Right-click the map to add a waypoint &middot; Left-click a marker for details</p>

        <div class="grid-controls">
          <button class="icon-btn" id="zoomInBtn" type="button" title="Zoom in" aria-label="Zoom in"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
          <button class="icon-btn" id="zoomOutBtn" type="button" title="Zoom out" aria-label="Zoom out"><i class="fa-solid fa-minus" aria-hidden="true"></i></button>
          <button class="icon-btn icon-btn--wide" id="recenterBtn" type="button" title="Back to origin" aria-label="Back to origin"><i class="fa-solid fa-crosshairs" aria-hidden="true"></i></button>
        </div>

        <div class="pin-tooltip" id="pinTooltip" hidden></div>
      </section>

      <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2 id="sidebarTitle">Overworld</h2>
          <span class="waypoint-count" id="waypointCount">0</span>
          <button class="modal-close sidebar-close-btn" id="sidebarCloseBtn" type="button" aria-label="Close waypoint list">&times;</button>
        </div>
        <div class="waypoint-search-wrap">
          <input type="search" id="waypointSearch" placeholder="Search waypoints" aria-label="Search waypoints" />
        </div>
        <div class="category-filter-row" id="categoryFilterRow"></div>
        <div class="waypoint-list" id="waypointList"></div>
      </aside>

      <section class="server-panel" id="serverPanel" hidden>
        <div class="server-card">
          <h2>Server</h2>
          <div class="server-field">
            <span class="server-field-label">Hostname</span>
            <span class="server-field-value" id="serverHostname">—</span>
            <button class="server-copy" type="button" data-copy-source="serverHostname" hidden>Copy</button>
          </div>
          <div class="server-field">
            <span class="server-field-label">Numeric IP</span>
            <span class="server-field-value" id="serverIp">—</span>
            <button class="server-copy" type="button" data-copy-source="serverIp" hidden>Copy</button>
          </div>
          <div class="server-edit" id="serverEdit" hidden>
            <h3>Edit</h3>
            <label>
              Hostname
              <input type="text" id="serverHostnameInput" autocomplete="off" />
            </label>
            <label>
              Numeric IP
              <input type="text" id="serverIpInput" autocomplete="off" />
            </label>
            <button class="btn btn-primary" id="serverSaveBtn" type="button">Save</button>
            <span class="form-msg" id="serverSaveMsg"></span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Auth modal -->
  <div class="modal-backdrop" id="authModal" hidden>
    <div class="modal auth-modal-card">
      <div class="auth-modal-header">
        <span class="auth-kicker">Miaucraft</span>
        <h2>Welcome back</h2>
        <p>Sign in to manage server waypoints.</p>
      </div>
      <div class="modal-tabs auth-tabs">
        <button class="modal-tab" data-authtab="login" data-active="true">Sign in</button>
        <button class="modal-tab" data-authtab="register">Create account</button>
      </div>

      <form class="modal-form" id="loginForm">
        <label>
          Username
          <input type="text" id="loginUsername" autocomplete="username" required />
        </label>
        <label>
          Password
          <span class="password-field">
            <input type="password" id="loginPassword" autocomplete="current-password" required />
            <button class="password-toggle" type="button" data-password-toggle="loginPassword" aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </span>
        </label>
        <button class="btn btn-primary" type="submit">Sign in</button>
        <span class="form-msg" id="loginMsg"></span>
      </form>

      <form class="modal-form" id="registerForm" hidden>
        <label>
          Username
          <input type="text" id="registerUsername" autocomplete="username" required />
        </label>
        <label>
          Password
          <span class="password-field">
            <input type="password" id="registerPassword" autocomplete="new-password" required />
            <button class="password-toggle" type="button" data-password-toggle="registerPassword" aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </span>
        </label>
        <label>
          Repeat password
          <span class="password-field">
            <input type="password" id="registerPasswordRepeat" autocomplete="new-password" required />
            <button class="password-toggle" type="button" data-password-toggle="registerPasswordRepeat" aria-label="Show password" aria-pressed="false"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </span>
        </label>
        <label>
          Access code
          <input type="text" id="registerCode" autocomplete="off" required />
        </label>
        <button class="btn btn-primary" type="submit">Create account</button>
        <span class="form-msg" id="registerMsg"></span>
      </form>
    </div>
  </div>

  <!-- Waypoint add/edit modal -->
  <div class="modal-backdrop" id="waypointModal" hidden>
    <div class="modal waypoint-modal-card">
      <div class="modal-tabs">
        <h3 class="modal-title" id="waypointModalTitle">Add waypoint</h3>
        <button class="modal-close" id="waypointModalClose" type="button">&times;</button>
      </div>

      <form class="modal-form" id="waypointForm">
        <input type="hidden" id="wpId" />
        <label>
          Name
          <input type="text" id="wpName" required maxlength="60" />
        </label>
        <label>
          Description
          <input type="text" id="wpDescription" maxlength="160" />
        </label>
        <div class="coord-row">
          <label>
            X
            <input type="number" id="wpX" step="1" required />
          </label>
          <label>
            Y (optional)
            <input type="number" id="wpY" step="1" />
          </label>
          <label>
            Z
            <input type="number" id="wpZ" step="1" required />
          </label>
        </div>
        <div class="nether-preview" id="netherPreview" hidden></div>
        <label>
          Category
          <select id="wpCategory">
            <option value="">No category</option>
          </select>
        </label>
        <label>
          Color
          <span class="color-picker">
            <input type="color" id="wpColor" value="#a78bfa" aria-label="Waypoint color" />
            <span class="color-value" id="wpColorValue">#A78BFA</span>
          </span>
        </label>
        <div class="modal-actions">
          <button class="btn btn-primary" type="submit">Save</button>
          <button class="btn btn-danger" id="wpDeleteBtn" type="button" hidden>Delete</button>
        </div>
        <span class="form-msg" id="waypointMsg"></span>
      </form>
    </div>
  </div>

  <!-- Categories panel (owner only) -->
  <div class="categories-panel" id="categoriesPanel" hidden>
    <div class="categories-panel-header">
      <h3>Categories</h3>
      <button class="modal-close" id="categoriesPanelClose" type="button" aria-label="Close categories panel">&times;</button>
    </div>
    <div class="categories-list" id="categoriesList"></div>
    <form class="category-form" id="categoryForm">
      <input type="hidden" id="catId" />
      <div class="category-form-row">
        <span class="color-picker category-color-picker">
          <input type="color" id="catColor" value="#a78bfa" aria-label="Category color" />
        </span>
        <input type="text" id="catName" placeholder="Category name" maxlength="40" required />
      </div>
      <div class="modal-actions">
        <button class="btn btn-primary" type="submit" id="catSubmitBtn">Add category</button>
        <button class="btn btn-ghost" id="catCancelEditBtn" type="button" hidden>Cancel</button>
      </div>
      <span class="form-msg" id="categoryMsg"></span>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
