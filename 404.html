<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Page not found - Miaucraft</title>
    <meta name="description" content="That page doesn't exist on the Miaucraft SMP." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/img/icon.webp" type="image/webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/384138011e.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/nav.css" />
    <link rel="stylesheet" href="/css/notfound.css" />
  </head>
  <body data-page="404">
    <a class="skip-link" href="#mainContent">Skip to content</a>
    <div class="app-shell">
      <div id="navRoot"></div>

      <main class="page-main notfound-main" id="mainContent">
        <div class="notfound">
          <div class="notfound-code" aria-hidden="true">404</div>
          <h1>This page doesn't exist</h1>
          <p class="notfound-path" id="missingPath"></p>
          <p class="notfound-desc">If you think this is an error, contact @xhvsh.</p>
          <a class="btn notfound-cta" href="/">Back to Miaucraft</a>

          <i class="fa-solid fa-paw notfound-paw notfound-paw--a" aria-hidden="true"></i>
          <i class="fa-solid fa-paw notfound-paw notfound-paw--b" aria-hidden="true"></i>
          <i class="fa-solid fa-paw notfound-paw notfound-paw--c" aria-hidden="true"></i>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script type="module" src="/js/pages/notfound.js"></script>
  </body>
</html>
